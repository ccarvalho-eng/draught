name: Native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_x86_64
            erts_url: "https://beam-machine-universal.b-cdn.net/OTP-28.4.1/linux/x86_64/any/otp_28.4.1_linux_any_x86_64.tar.gz?please-respect-my-bandwidth-costs=thank-you&openssl=3.5.5&musl=1.2.5"
            erts_sha256: f2da7e74505a94848dee445f3db2b9411385b7d0b4eb25db50f82e1fcdcdea62
            musl_url: "https://beam-machine-universal.b-cdn.net/musl/libc-musl-71c35316aff45bbfd243d8eb9bfc4a58b6eb97cee09514cd2030e145b68107fb.so?please-respect-my-bandwidth-costs=thank-you"
            musl_sha256: 71c35316aff45bbfd243d8eb9bfc4a58b6eb97cee09514cd2030e145b68107fb
          - runner: ubuntu-24.04-arm
            target: linux_arm64
            erts_url: "https://beam-machine-universal.b-cdn.net/OTP-28.4.1/linux/aarch64/any/otp_28.4.1_linux_any_aarch64.tar.gz?please-respect-my-bandwidth-costs=thank-you&openssl=3.5.5&musl=1.2.5"
            erts_sha256: 7faccffeffadfc27a8e3cf0ac68d728bfd14cd321bea511aaf9f3934a647329d
            musl_url: "https://beam-machine-universal.b-cdn.net/musl/libc-musl-6b558025200a5ed1308e2ce2675217afec71b6c5a9d561e52262ca948d59905e.so?please-respect-my-bandwidth-costs=thank-you"
            musl_sha256: 6b558025200a5ed1308e2ce2675217afec71b6c5a9d561e52262ca948d59905e
          - runner: macos-15-intel
            target: macos_x86_64
            erts_url: "https://beam-machine-universal.b-cdn.net/OTP-28.4.1/macos/universal/otp_28.4.1_macos_universal.tar.gz?please-respect-my-bandwidth-costs=thank-you&openssl=3.5.5&musl=1.2.5"
            erts_sha256: 3fa9f8aad669e7fdfcceb5ce5de4235e96c3b55fb997b9ecd620529c3e3e086f
            musl_url: ""
            musl_sha256: ""
          - runner: macos-15
            target: macos_arm64
            erts_url: "https://beam-machine-universal.b-cdn.net/OTP-28.4.1/macos/universal/otp_28.4.1_macos_universal.tar.gz?please-respect-my-bandwidth-costs=thank-you&openssl=3.5.5&musl=1.2.5"
            erts_sha256: 3fa9f8aad669e7fdfcceb5ce5de4235e96c3b55fb997b9ecd620529c3e3e086f
            musl_url: ""
            musl_sha256: ""
    env:
      MIX_ENV: prod
      MIX_TARGET: cli
      BURRITO_TARGET: ${{ matrix.target }}
      DRAUGHT_ERTS_URL: ${{ matrix.erts_url }}
      DRAUGHT_ERTS_SHA256: ${{ matrix.erts_sha256 }}
      DRAUGHT_MUSL_URL: ${{ matrix.musl_url }}
      DRAUGHT_MUSL_SHA256: ${{ matrix.musl_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.4.1"
          version-type: strict

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install Linux build dependency
        if: runner.os == 'Linux'
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=-
            sudo apt-get install --yes xz-utils
          fi

      - name: Install macOS build dependency
        if: runner.os == 'macOS'
        run: brew list xz || brew install xz

      - name: Fetch verified runtime inputs
        shell: bash
        run: |
          set -euo pipefail

          verify_sha256() {
            local file="$1"
            local expected="$2"
            local actual

            if command -v sha256sum >/dev/null 2>&1; then
              actual=$(sha256sum "$file")
            else
              actual=$(shasum -a 256 "$file")
            fi

            actual=${actual%% *}

            if [[ "$actual" != "$expected" ]]; then
              echo "::error::SHA-256 verification failed for $(basename "$file")"
              exit 1
            fi
          }

          runtime_root=$(mktemp -d)
          erts_archive="$runtime_root/erts.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "$DRAUGHT_ERTS_URL" --output "$erts_archive"
          verify_sha256 "$erts_archive" "$DRAUGHT_ERTS_SHA256"
          echo "DRAUGHT_ERTS_ARCHIVE=$erts_archive" >> "$GITHUB_ENV"

          if [[ -n "$DRAUGHT_MUSL_URL" ]]; then
            musl_archive="$runtime_root/musl-runtime.so"
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
              "$DRAUGHT_MUSL_URL" --output "$musl_archive"
            verify_sha256 "$musl_archive" "$DRAUGHT_MUSL_SHA256"
            echo "DRAUGHT_MUSL_ARCHIVE=$musl_archive" >> "$GITHUB_ENV"
          fi

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Build native executable
        run: mix release draught

      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(mix run --no-start --no-compile -e 'IO.write(Mix.Project.config()[:version])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build escript
        env:
          MIX_TARGET: host
        run: mix escript.build

      - name: Smoke escript
        timeout-minutes: 3
        shell: bash
        env:
          DRAUGHT_BUILD_VERSION: ${{ steps.package.outputs.version }}
        run: |
          smoke_root=$(mktemp -d)
          env -i HOME="$smoke_root" XDG_CONFIG_HOME="$smoke_root/config" XDG_DATA_HOME="$smoke_root/data" XDG_STATE_HOME="$smoke_root/state" PATH="$PATH" \
            sh scripts/smoke-cli.sh "$PWD/draught" "$DRAUGHT_BUILD_VERSION"

      - name: Package executable and verify checksum
        shell: bash
        run: |
          archive="draught-${BURRITO_TARGET}.tar.gz"
          tar -czf "$archive" -C burrito_out "draught_${BURRITO_TARGET}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
            sha256sum --check "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
            shasum -a 256 --check "$archive.sha256"
          fi

      - name: Smoke packaged executable without a system BEAM
        timeout-minutes: 3
        shell: bash
        env:
          DRAUGHT_BUILD_VERSION: ${{ steps.package.outputs.version }}
        run: |
          artifact_root=$(mktemp -d)
          smoke_root=$(mktemp -d)
          archive="draught-${BURRITO_TARGET}.tar.gz"
          tar -xzf "$archive" -C "$artifact_root"
          executable="$artifact_root/draught_${BURRITO_TARGET}"
          env -i HOME="$smoke_root" XDG_CONFIG_HOME="$smoke_root/config" XDG_DATA_HOME="$smoke_root/data" XDG_STATE_HOME="$smoke_root/state" PATH=/usr/bin:/bin DRAUGHT_STANDALONE_SMOKE=1 \
            sh scripts/smoke-cli.sh "$executable" "$DRAUGHT_BUILD_VERSION"

      - name: Upload native build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: draught-${{ matrix.target }}
          path: |
            draught-${{ matrix.target }}.tar.gz
            draught-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
